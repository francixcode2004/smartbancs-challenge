name: smartbancs

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartbancs
      POSTGRES_USER: smartbancs
      POSTGRES_PASSWORD: smartbancs_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartbancs -d smartbancs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartbancs
      SPRING_DATASOURCE_USERNAME: smartbancs
      SPRING_DATASOURCE_PASSWORD: smartbancs_local
      JWT_SECRET: ${JWT_SECRET:-}
      RECOMMENDATIONS_URL: http://recommendations:8000
    depends_on:
      postgres:
        condition: service_healthy
      recommendations:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '^OK$'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  recommendations:
    build:
      context: ./services/recommendations
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEY: ${API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

  prometheus:
    image: prom/prometheus:v3.8.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-smartbancs_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
