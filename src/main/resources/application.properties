spring.application.name=SmartBancsApp

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbancs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartbancs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartbancs_local}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.pool-name=SmartBancsPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.validation-timeout=250
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.register-mbeans=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

bancs.sync.fixed-delay-ms=${BANCS_SYNC_FIXED_DELAY_MS:15000}
bancs.mock.fail=${BANCS_MOCK_FAIL:false}
